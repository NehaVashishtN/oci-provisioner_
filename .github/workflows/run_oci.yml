name: OCI Capacity Hunter
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install

      - name: Create .env and Key File
        run: |
          # 1. Create the Key File
          cat <<EOF > oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY_FILENAME }}
          EOF
          chmod 600 oci_api_key.pem

          # 2. Create the .env using a Heredoc to prevent quoting/whitespace issues
          # Note: We do NOT put quotes around the secrets here; the heredoc handles the string literal
          cat <<EOF > .env
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SSH_PUBLIC_KEY=${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_PRIVATE_KEY_FILENAME=$GITHUB_WORKSPACE/oci_api_key.pem
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_OCPUs=4
          OCI_MEMORY_IN_GBS=24
          OCI_BOOT_VOLUME_SIZE_IN_GBS=200
          EOF

          # 3. Final "Sanity Strip" - This removes any accidental carriage returns (\r) 
          # from the .env file that might have come from a Windows/Mac copy-paste.
          sed -i 's/\r//g' .env

      - name: Run Script
        run: |
          # Removing the "> output.txt" so the error prints to the screen
          php -d display_errors=1 -d error_reporting=E_ALL index.php

      - name: Send Telegram Notification
        if: env.INSTANCE_CREATED == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 OCI SUCCESS: Your 24GB ARM Instance is being created for your NevilLabs project!"

