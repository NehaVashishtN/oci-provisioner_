name: OCI Capacity Hunter
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install

      - name: Create .env and Key File
        run: |
          cat <<EOF > oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY_FILENAME }}
          EOF
          chmod 600 oci_api_key.pem

          echo "OCI_PRIVATE_KEY_FILENAME=$GITHUB_WORKSPACE/oci_api_key.pem" >> .env
          
          # Fixed syntax for all secrets
          echo "OCI_USER_ID=$(echo ${{ secrets.OCI_USER_ID }} | tr -d '[:space:]')" >> .env
          echo "OCI_TENANCY_ID=$(echo ${{ secrets.OCI_TENANCY_ID }} | tr -d '[:space:]')" >> .env
          echo "OCI_REGION=$(echo ${{ secrets.OCI_REGION }} | tr -d '[:space:]')" >> .env
          echo "OCI_KEY_FINGERPRINT=$(echo ${{ secrets.OCI_KEY_FINGERPRINT }} | tr -d '[:space:]')" >> .env
          echo "OCI_SUBNET_ID=$(echo ${{ secrets.OCI_SUBNET_ID }} | tr -d '[:space:]')" >> .env
          echo "OCI_IMAGE_ID=$(echo ${{ secrets.OCI_IMAGE_ID }} | tr -d '[:space:]')" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=$(echo ${{ secrets.OCI_AVAILABILITY_DOMAIN }} | tr -d '[:space:]')" >> .env
          echo "OCI_SSH_PUBLIC_KEY=$(echo ${{ secrets.OCI_SSH_PUBLIC_KEY }} | tr -d '[:space:]')" >> .env
          
          echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
          echo "OCI_OCPUs=4" >> .env
          echo "OCI_MEMORY_IN_GBS=24" >> .env
          echo "OCI_BOOT_VOLUME_SIZE_IN_GBS=200" >> .env

      - name: Run Script
        run: |
          # Removing the "> output.txt" so the error prints to the screen
          php -d display_errors=1 -d error_reporting=E_ALL index.php

      - name: Send Telegram Notification
        if: env.INSTANCE_CREATED == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 OCI SUCCESS: Your 24GB ARM Instance is being created for your NevilLabs project!"

