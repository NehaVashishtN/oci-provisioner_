name: OCI Capacity Hunter
on:
  schedule:
    - cron: '* * * * *'  # Requests to run every minute (GitHub may delay this slightly)
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Random Jitter
        run: sleep $((RANDOM % 45)) # Adds 0-45 seconds of jitter to avoid "bot" detection

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Stable version to avoid 8.5 deprecation errors

      - name: Install dependencies
        run: composer install

      - name: Create .env and Key File
        run: |
          # Create the file from the secret content
          cat <<EOF > oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY_FILENAME }}
          EOF
          
          chmod 600 oci_api_key.pem

          # Verify the key is readable (for debugging, won't show content)
          openssl rsa -in oci_api_key.pem -check -noout
          
          # Map the .env variable to the path of the file we just created
          echo "OCI_PRIVATE_KEY_FILENAME=$GITHUB_WORKSPACE/oci_api_key.pem" >> .env
          
          echo "OCI_USER_ID=${{ secrets.OCI_USER_ID }}" >> .env
          echo "OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}" >> .env
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" >> .env
          echo "OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}" >> .env
          echo "OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}" >> .env
          
          echo "OCI_IMAGE_ID=$(echo ${{ secrets.OCI_IMAGE_ID }} | tr -d '\r\n ')" >> .env
          
          echo "OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}" >> .env

          echo "OCI_SSH_PUBLIC_KEY='${{ secrets.OCI_SSH_PUBLIC_KEY }}'" >> .env
          
          echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
          
          # Force these to be treated as clean integers
          echo "OCI_OCPUs=4" >> .env
          echo "OCI_MEMORY_IN_GBS=24" >> .env
          
          echo "OCI_BOOT_VOLUME_SIZE_IN_GBS=${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS }}" >> .env
          echo "TOO_MANY_REQUESTS_TIME_WAIT=${{ secrets.TOO_MANY_REQUESTS_TIME_WAIT }}" >> .env

      - name: Run Script
        run: php index.php
